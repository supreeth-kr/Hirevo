{% extends 'base.html' %}
{% block title %}Reset Password - Hirevo{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="hirevo-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <div class="stat-kpi-icon bg-light text-primary mx-auto mb-2" style="width: 48px; height: 48px;">
            <i class="bi bi-key-fill fs-4"></i>
          </div>
          <h4 class="fw-bold">Reset Your Password</h4>
          <p class="text-muted small">Enter your email address and we'll send a password recovery simulation link.</p>
        </div>

        <form method="post" action="{% url 'password_reset' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
          </div>
          <button type="submit" class="btn btn-hirevo w-100 py-2 mb-3">Send Reset Instructions</button>
        </form>

        <div class="text-center pt-3 border-top">
          <a href="{% url 'login' %}" class="fw-semibold text-muted text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
