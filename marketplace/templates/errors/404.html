{% extends 'base.html' %}
{% block title %}404 - Page Not Found - Hirevo{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="hirevo-card p-5 max-w-600 mx-auto">
    <div class="stat-kpi-icon bg-warning bg-opacity-10 text-warning mx-auto mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-compass fs-1"></i>
    </div>
    <h1 class="display-4 fw-extrabold text-dark mb-2">404</h1>
    <h4 class="fw-bold mb-2">Page Not Found</h4>
    <p class="text-muted small mb-4">
      The service, freelancer profile, or dashboard page you requested does not exist or has been relocated.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'home' %}" class="btn btn-hirevo">Return Home</a>
      <a href="{% url 'gig_list' %}" class="btn btn-hirevo-outline">Browse Marketplace</a>
    </div>
  </div>
</div>
{% endblock %}
