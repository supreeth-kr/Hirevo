{% extends 'base.html' %}
{% block title %}500 - Server Error - Hirevo{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="hirevo-card p-5 max-w-600 mx-auto">
    <div class="stat-kpi-icon bg-danger bg-opacity-10 text-danger mx-auto mb-3" style="width: 80px; height: 80px;">
      <i class="bi bi-gear-wide-connected fs-1"></i>
    </div>
    <h1 class="display-4 fw-extrabold text-danger mb-2">500</h1>
    <h4 class="fw-bold mb-2">Internal Server Error</h4>
    <p class="text-muted small mb-4">
      An unexpected internal server error occurred while processing your request. Please retry in a few moments.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="{% url 'home' %}" class="btn btn-hirevo">Return Home</a>
      <a href="{% url 'gig_list' %}" class="btn btn-hirevo-outline">Browse Services</a>
    </div>
  </div>
</div>
{% endblock %}
