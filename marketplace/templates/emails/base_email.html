<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
    table {
      border-collapse: collapse;
    }
    .email-container {
      max-width: 600px;
      margin: 20px auto;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .email-header {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
      padding: 28px 32px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      vertical-align: middle;
      margin-left: 6px;
    }
    .brand-tagline {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      margin-bottom: 0;
    }
    .email-body {
      padding: 32px;
      color: #e2e8f0;
      line-height: 1.6;
      font-size: 15px;
    }
    .btn-primary {
      display: inline-block;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff !important;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      text-align: center;
      margin-top: 16px;
      margin-bottom: 16px;
    }
    .info-card {
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px 20px;
      margin: 20px 0;
    }
    .info-table {
      width: 100%;
    }
    .info-table td {
      padding: 8px 0;
      font-size: 14px;
      vertical-align: top;
    }
    .info-label {
      color: #94a3b8;
      width: 35%;
      font-weight: 500;
    }
    .info-value {
      color: #f8fafc;
      font-weight: 600;
      width: 65%;
    }
    .status-pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .email-footer {
      background: #0d131f;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: #64748b;
    }
    .email-footer a {
      color: #10b981;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div style="padding: 20px 10px;">
    <div class="email-container">
      
      <!-- Email Header -->
      <div class="email-header">
        <h1 class="brand-title">
          Hirevo <span class="brand-badge">AI Platform</span>
        </h1>
        <p class="brand-tagline">AI-Powered Freelance Marketplace & Project Continuity Engine</p>
      </div>

      <!-- Email Content -->
      <div class="email-body">
        {% block content %}{% endblock %}
      </div>

      <!-- Email Footer -->
      <div class="email-footer">
        <p style="margin: 0 0 8px 0;">This is an automated notification from <strong>Hirevo</strong>.</p>
        <p style="margin: 0 0 8px 0;">Visit your workspace anytime at <a href="{{ site_url }}">{{ site_url }}</a></p>
        <p style="margin: 0; color: #475569;">&copy; {{ current_year }} Hirevo. All rights reserved.</p>
      </div>

    </div>
  </div>
</body>
</html>
