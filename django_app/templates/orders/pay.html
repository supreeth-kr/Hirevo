{% extends 'partials/base.html' %}
{% block title %} - Pay{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:550px">
  <h2 class="fw-bold mb-4">Complete Your Order</h2>
  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <h5>{{ gig.title }}</h5>
      <p class="text-muted">{{ gig.short_desc }}</p>
      <h4 class="text-success fw-bold">${{ gig.price }}</h4>
    </div>
  </div>
  <div id="payment-form">
    <div id="payment-element" class="mb-3"></div>
    <button id="pay-btn" class="btn btn-success w-100 py-2 fw-bold">Pay ${{ gig.price }}</button>
    <div id="payment-message" class="text-danger mt-2"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://js.stripe.com/v3/"></script>
<script>
const stripe = Stripe('{{ stripe_key }}');
let elements;

fetch('{% url "payment_intent" gig.pk %}', {
  method: 'POST',
  headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
  body: JSON.stringify({})
}).then(r => r.json()).then(data => {
  elements = stripe.elements({clientSecret: data.clientSecret});
  elements.create('payment').mount('#payment-element');
});

document.getElementById('pay-btn').addEventListener('click', async () => {
  const {error, paymentIntent} = await stripe.confirmPayment({
    elements,
    redirect: 'if_required'
  });
  if (error) {
    document.getElementById('payment-message').textContent = error.message;
  } else {
    await fetch('{% url "payment_success" %}', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({payment_intent: paymentIntent.id})
    });
    window.location.href = '{% url "orders" %}';
  }
});
</script>
{% endblock %}
